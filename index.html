<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Memo Finance</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finance">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="theme-color" content="#0F2725">
<meta name="format-detection" content="telephone=no">
<style>
/* Layout: one phone column (max 560px), iOS large titles, inset grouped lists, floating glass tab bar, bottom sheets.
   Every screen is a list of blocks so Developer mode can reorder, hide and add them. */
:root{
  --bg:#EDF1F0; --surface:#FFFFFF; --surface-2:#F5F7F7; --ink:#0D1B1A; --ink-2:#4B5E5B; --ink-3:#7E8F8C; --line:#DCE4E2;
  --accent:#0A6B63; --accent-ink:#FFFFFF; --accent-soft:#D9EEEA; --glass-pill:rgba(10,107,99,.13);
  --hero:#0F2725; --hero-ink:#EEF7F5; --hero-dim:#9DBDB8; --hero-track:rgba(255,255,255,.12);
  --good:#1E8A4C; --good-soft:#DDF2E5; --warn:#A8670F; --warn-soft:#FBEBD3; --bad:#C2413A; --bad-soft:#F8DEDC;
  --c-debt:#E08A2E; --c-family:#12A394; --c-living:#4C7FE0; --c-car:#9A63D6; --c-ef:#46B26A; --c-goal:#C9A227; --c-other:#8A9896; --c-free:#C9D4D2;
  --shadow:0 1px 2px rgba(13,27,26,.05),0 6px 20px rgba(13,27,26,.06);
  --glass:rgba(255,255,255,.58); --glass-edge:rgba(255,255,255,.75); --glass-hi:rgba(255,255,255,.9);
  --glass-shadow:0 10px 34px rgba(13,27,26,.16),0 1px 3px rgba(13,27,26,.08);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,"Noto Sans Arabic",Tahoma,sans-serif;
  --spring:cubic-bezier(.34,1.56,.64,1); --r-lg:22px; --r-md:16px; --r-sm:12px; --statusbar:#0F2725; --dir:1; --zoom:1;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#080E0D; --surface:#121B1A; --surface-2:#182321; --ink:#E9F1EF; --ink-2:#A3B5B2; --ink-3:#73878A; --line:#22302E;
  --accent:#3DC4B3; --accent-ink:#03201C; --accent-soft:#12332F; --glass-pill:rgba(61,196,179,.20);
  --hero:#10302C; --hero-ink:#EEF7F5; --hero-dim:#94B8B2; --hero-track:rgba(255,255,255,.10);
  --good:#4CC47C; --good-soft:#123222; --warn:#E5A44A; --warn-soft:#33250F; --bad:#EF7A71; --bad-soft:#3A1715;
  --c-debt:#F0A050; --c-family:#2CC4B3; --c-living:#7AA2F0; --c-car:#B88AE8; --c-ef:#62CC86; --c-goal:#E5C25A; --c-other:#8FA3A0; --c-free:#33423F;
  --shadow:0 1px 2px rgba(0,0,0,.3); --statusbar:#080E0D;
  --glass:rgba(28,40,38,.58); --glass-edge:rgba(255,255,255,.12); --glass-hi:rgba(255,255,255,.10); --glass-shadow:0 10px 34px rgba(0,0,0,.55),0 1px 3px rgba(0,0,0,.4);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#080E0D; --surface:#121B1A; --surface-2:#182321; --ink:#E9F1EF; --ink-2:#A3B5B2; --ink-3:#73878A; --line:#22302E;
  --accent:#3DC4B3; --accent-ink:#03201C; --accent-soft:#12332F; --glass-pill:rgba(61,196,179,.20);
  --hero:#10302C; --hero-ink:#EEF7F5; --hero-dim:#94B8B2; --hero-track:rgba(255,255,255,.10);
  --good:#4CC47C; --good-soft:#123222; --warn:#E5A44A; --warn-soft:#33250F; --bad:#EF7A71; --bad-soft:#3A1715;
  --c-debt:#F0A050; --c-family:#2CC4B3; --c-living:#7AA2F0; --c-car:#B88AE8; --c-ef:#62CC86; --c-goal:#E5C25A; --c-other:#8FA3A0; --c-free:#33423F;
  --shadow:0 1px 2px rgba(0,0,0,.3); --statusbar:#080E0D;
  --glass:rgba(28,40,38,.58); --glass-edge:rgba(255,255,255,.12); --glass-hi:rgba(255,255,255,.10); --glass-shadow:0 10px 34px rgba(0,0,0,.55),0 1px 3px rgba(0,0,0,.4);
  color-scheme:dark;
}
[dir="rtl"]{--dir:-1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{margin:0;padding-top:env(safe-area-inset-top,0px);overscroll-behavior-y:none;color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.4;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--statusbar)}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;zoom:var(--zoom);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:8px calc(118px + env(safe-area-inset-bottom,0px))}
.hide-amts .amt{filter:blur(7px);transition:filter .2s}
.hide-amts .amt:active{filter:none}

.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:14px}
.top h1{margin:0;font-size:32px;font-weight:800;letter-spacing:-.025em;line-height:1.05;text-wrap:balance}
[dir="rtl"] .top h1{letter-spacing:0}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}
.top-r{display:flex;align-items:center;gap:8px}
.iconbtn{width:36px;height:36px;border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--accent);box-shadow:var(--shadow);flex:none}
.iconbtn svg{width:19px;height:19px}
.iconbtn.on{background:var(--accent);color:var(--accent-ink)}
.stack{display:flex;flex-direction:column;gap:18px}

.hero{background:var(--hero);color:var(--hero-ink);border-radius:var(--r-lg);padding:20px 20px 18px;display:flex;flex-direction:column;gap:16px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset-inline-end:-60px;top:-60px;width:200px;height:200px;border-radius:50%;border:28px solid var(--hero-track);pointer-events:none}
.hero .lbl{font-size:13px;color:var(--hero-dim);font-weight:500}
.hero .big{font-size:clamp(30px,10vw,40px);font-weight:800;letter-spacing:-.03em;line-height:1.05}
.hero .big small{font-size:15px;font-weight:600;color:var(--hero-dim);letter-spacing:0;margin-inline-start:6px}
.hero .usd{font-size:13px;color:var(--hero-dim);margin-top:6px}
.hero-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hero-row div{background:var(--hero-track);border-radius:var(--r-sm);padding:10px 12px}
.hero-row b{display:block;font-size:17px;font-weight:700;margin-top:2px}
.hero-row span{font-size:12px;color:var(--hero-dim)}
.neg{color:var(--bad)}
.hero .neg{color:#FF9A90}

.bar{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--c-free);gap:2px}
.bar span{display:block;height:100%;min-width:3px}
.legend{display:flex;flex-direction:column}
.legend-row{display:grid;grid-template-columns:10px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line);font-size:14px;width:100%;text-align:start}
.legend-row:first-child{border-top:0}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.legend-row .pct{color:var(--ink-3);font-size:12px;min-width:36px;text-align:end}
.legend-row .amt-c{font-weight:600}

.card{background:var(--surface);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow)}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 4px 8px}
.sec-h h2{margin:0;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
[dir="rtl"] .sec-h h2,[dir="rtl"] .eyebrow,[dir="rtl"] .kpi span,[dir="rtl"] .debt-stats span{letter-spacing:0}
.sec-h .link{font-size:14px;font-weight:600;color:var(--accent)}
.sec-h .tot{font-size:13px;color:var(--ink-2);font-weight:600}

.list{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:start;padding:13px 16px;min-height:50px;position:relative}
.row + .row::before{content:"";position:absolute;inset-inline-start:16px;inset-inline-end:0;top:0;border-top:1px solid var(--line)}
.row .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub{display:block;font-size:12px;color:var(--ink-3);margin-top:1px;overflow:hidden;text-overflow:ellipsis}
.row .val{font-weight:600;white-space:nowrap}
.row .val.dim{color:var(--ink-3);font-weight:500}
.chev{width:7px;height:12px;flex:none;color:var(--ink-3)}
[dir="rtl"] .chev{transform:scaleX(-1)}
button.row:active{background:var(--surface-2)}
.row.add{color:var(--accent);font-weight:600}
.row.add .plus{width:22px;height:22px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;font-size:17px;line-height:1}
.row.total{background:var(--surface-2)}
.row.total .name,.row.total .val{font-weight:700}
.ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;color:#fff;font-size:13px;font-weight:700}

.debts{display:grid;gap:12px}
.debt,.mcard{background:var(--surface);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow);text-align:start;width:100%;display:flex;flex-direction:column;gap:12px}
.debt:active,.mcard:active{transform:scale(.99)}
.mcard.now{outline:2px solid var(--accent);outline-offset:-2px}
.debt-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.debt-top h3{margin:0;font-size:17px;font-weight:700}
.debt-top .sub{font-size:12px;color:var(--ink-3);margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:4px 8px;border-radius:999px;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.mute{background:var(--surface-2);color:var(--ink-3)}
.prog{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.prog span{display:block;height:100%;border-radius:999px;background:var(--accent)}
.prog.done span{background:var(--good)}
.prog.over span{background:var(--bad)}
.debt-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.debt-stats span{display:block;font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.debt-stats b{font-size:15px;font-weight:700}

.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpis.n2{grid-template-columns:repeat(2,minmax(0,1fr))}
.kpis.n1{grid-template-columns:1fr}
.kpi{background:var(--surface);border-radius:var(--r-md);padding:12px;box-shadow:var(--shadow);min-width:0}
.kpi span{display:block;font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi b{display:block;font-size:18px;font-weight:800;letter-spacing:-.02em;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi small{font-size:11px;color:var(--ink-3);display:block;line-height:1.3}

.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.act{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow);padding:12px;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;text-align:start;min-width:0}
.act svg{width:22px;height:22px;color:var(--accent);flex:none}
.act span{min-width:0}
.act small{display:block;font-size:11.5px;font-weight:500;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act:active{transform:scale(.96)}

/* health gauge */
.health{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.gauge{position:relative;width:96px;height:96px}
.gauge svg{width:96px;height:96px;transform:rotate(-90deg)}
.gauge b{position:absolute;inset:0;display:grid;place-items:center;font-size:26px;font-weight:800}
.hrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;font-size:13px;padding:3px 0}
.hrow span:last-child{color:var(--ink-3);font-weight:600}

/* alerts */
.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;font-size:14px;font-weight:500;text-align:start;width:100%}
.alert i{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none}
.alert.bad{background:var(--bad-soft)} .alert.bad i{background:var(--bad)}
.alert.warn{background:var(--warn-soft)} .alert.warn i{background:var(--warn)}
.alert.info{background:var(--accent-soft)} .alert.info i{background:var(--accent)}
.alerts{display:flex;flex-direction:column;gap:8px}

/* charts */
.chart{display:flex;align-items:flex-end;gap:6px;height:130px;padding-top:16px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end;min-width:0}
.chart .b{width:100%;max-width:28px;border-radius:6px 6px 3px 3px;min-height:3px;position:relative}
.chart .b em{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-style:normal;font-size:9.5px;color:var(--ink-3);white-space:nowrap;margin-bottom:2px}
.chart .b.zero{background:var(--line)!important}
.chart .m{font-size:10px;color:var(--ink-3);white-space:nowrap;overflow:hidden;max-width:100%}
.line-wrap{position:relative;height:130px}
.line-wrap svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.line-lbl{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-3);margin-top:6px}
.donut{display:grid;grid-template-columns:140px minmax(0,1fr);gap:16px;align-items:center}
.donut svg{width:140px;height:140px;transform:rotate(-90deg);justify-self:center}
@media (max-width:480px){.donut{grid-template-columns:1fr}}
.pa-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.pa-row:first-child{border-top:0}
.pa-row .prog{grid-column:1 / -1;height:6px}
.pa-row small{color:var(--ink-3);font-size:12px}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.chip.good{background:var(--good-soft);color:var(--good)}
.mini-btn{font-size:13px;font-weight:700;color:var(--accent);padding:6px 10px;border-radius:999px;background:var(--accent-soft);white-space:nowrap}
.paid-tag{font-size:12px;font-weight:700;color:var(--good);background:var(--good-soft);padding:4px 9px;border-radius:999px;white-space:nowrap}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 16px;border-radius:14px;font-weight:700;font-size:16px;background:var(--accent);color:var(--accent-ink)}
.btn:active{opacity:.85}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:#fff}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.empty{text-align:center;padding:48px 20px;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty h2{margin:0;font-size:20px}
.empty p{margin:0;color:var(--ink-2);max-width:34ch}
.note{font-size:12px;color:var(--ink-3);padding:0 4px;line-height:1.5;margin:0}
.note-card{white-space:pre-wrap;line-height:1.55}
.preview-bar{background:var(--warn-soft);color:var(--warn);font-size:13px;font-weight:600;border-radius:12px;padding:9px 12px;margin-bottom:14px}

/* checklist */
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;transition:background .15s,border-color .15s}
.check svg{width:14px;height:14px;opacity:0;color:#fff}
.check.on{background:var(--good);border-color:var(--good)}
.check.on svg{opacity:1}
.sched .row{padding:10px 16px}
.sched .amtbtn{font-weight:600;padding:6px 8px;border-radius:8px;background:var(--surface-2)}
.sched .row.next{background:var(--accent-soft)}
.row.done .name{color:var(--ink-3)}

/* developer mode */
.dev-on .blk{position:relative;border:1.5px dashed color-mix(in srgb,var(--accent) 55%,transparent);border-radius:calc(var(--r-lg) + 6px);padding:6px}
.dev-bar{display:flex;align-items:center;gap:4px;padding:2px 4px 8px}
.dev-bar .nm{flex:1;min-width:0;font-size:12px;font-weight:700;color:var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dev-bar button{width:30px;height:30px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.dev-bar button svg{width:15px;height:15px}
.blk.is-hidden>.blk-body{opacity:.35;pointer-events:none;max-height:90px;overflow:hidden}
.dev-banner{display:flex;align-items:center;gap:10px;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:10px 14px;font-size:13px;font-weight:600;margin-bottom:14px}
.dev-banner button{margin-inline-start:auto;background:rgba(255,255,255,.22);padding:6px 10px;border-radius:999px;font-weight:700;color:inherit}

/* settings */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);background:var(--surface-2);border-radius:11px;padding:3px;gap:3px}
.seg button{padding:8px 4px;border-radius:9px;font-size:13px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.set-row{display:flex;flex-direction:column;gap:8px;padding:12px 16px}
.set-row + .set-row,.set-row + .row,.row + .set-row{border-top:1px solid var(--line)}
.set-row label,.set-lbl{font-size:14px;font-weight:600}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 1px var(--line)}
.sw.on{border-color:var(--surface);box-shadow:0 0 0 2px var(--ink)}
.toggle{position:relative;width:51px;height:31px;flex:none}
.toggle input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:2;width:100%;height:100%}
.toggle span{pointer-events:none}
.toggle span{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .2s}
.toggle span::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:transform .25s var(--spring)}
.toggle input:checked + span{background:var(--good)}
.toggle input:checked + span::after{transform:translateX(calc(20px * var(--dir)))}

/* tab bar: floating liquid-glass capsule */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;pointer-events:none;padding:0 max(14px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.tabbar nav{pointer-events:auto;position:relative;max-width:470px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:6px;border-radius:32px;background:var(--glass);backdrop-filter:blur(24px) saturate(1.9);-webkit-backdrop-filter:blur(24px) saturate(1.9);border:1px solid var(--glass-edge);box-shadow:var(--glass-shadow),inset 0 1px 0 var(--glass-hi);transform-origin:50% 100%;transition:transform .5s var(--spring);touch-action:pan-y;user-select:none;-webkit-user-select:none}
.tab-ind{position:absolute;top:6px;bottom:6px;inset-inline-start:6px;width:calc((100% - 12px) / 5);border-radius:26px;background:var(--glass-pill);box-shadow:inset 0 1px 0 var(--glass-hi);transform:translateX(calc(var(--i,0) * 100% * var(--dir)));transition:transform .55s var(--spring),scale .45s var(--spring);pointer-events:none}
.tabbar nav.moving .tab-ind{scale:1.16 .88}
.tabbar nav.dragging .tab-ind{transition:transform .22s ease-out,scale .3s var(--spring);scale:1.2 1.06}
.tab{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;font-size:10.5px;font-weight:600;color:var(--ink-2);transition:color .25s,transform .3s var(--spring);min-width:0}
.tab svg{width:23px;height:23px;transition:transform .5s var(--spring)}
.tab span{max-height:14px;overflow:hidden;white-space:nowrap;max-width:100%;text-overflow:ellipsis;transition:opacity .2s,max-height .35s var(--spring)}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"] svg{transform:scale(1.1) translateY(-1px)}
.tab:active{transform:scale(.88)}
.tabbar.mini nav{transform:scale(.88) translateY(6px)}
.tabbar.mini .tab span,.no-labels .tab span{opacity:0;max-height:0}
.tabbar.mini .tab,.no-labels .tab{padding:9px 0 8px}
.topbar{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);z-index:25;display:flex;justify-content:center;padding:10px 16px;font-weight:700;font-size:16px;background:var(--glass);backdrop-filter:blur(24px) saturate(1.9);-webkit-backdrop-filter:blur(24px) saturate(1.9);border-bottom:1px solid var(--line);opacity:0;transform:translateY(-8px);transition:opacity .25s,transform .35s var(--spring);pointer-events:none}
.topbar.on{opacity:1;transform:none}

/* PIN lock */
#lock{position:fixed;inset:0;z-index:100;background:var(--hero);color:var(--hero-ink);display:grid;place-items:center;padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px)}
.lock-in{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;max-width:300px}
.lock-ic svg{width:34px;height:34px;color:var(--hero-dim)}
.lock-in h2{margin:0;font-size:20px}
.dots{display:flex;gap:16px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--hero-dim)}
.dots i.on{background:var(--hero-ink);border-color:var(--hero-ink)}
.dots.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.lock-msg{min-height:18px;margin:0;font-size:13px;color:#FFB4AC;text-align:center}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px 22px;margin-top:6px}
.pad button{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.12);color:var(--hero-ink);font-size:28px;font-weight:500}
.pad button:active{background:rgba(255,255,255,.28)}
.lock-forgot{color:var(--hero-dim);font-size:14px;font-weight:600;margin-top:8px;padding:8px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,12,11,.45);z-index:40;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:560px;margin:0 auto;background:var(--bg);border-radius:22px 22px 0 0;max-height:calc(100% - env(safe-area-inset-top,0px) - 24px);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.on{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0;flex:none}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;flex:none}
.sheet-h h3{margin:0;font-size:18px;font-weight:700;flex:1;text-align:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-h button,.sheet-h .sp{font-weight:600;color:var(--accent);min-width:64px;padding:6px 0;text-align:start}
.sheet-h > :last-child{text-align:end}
.sheet-b>*{flex-shrink:0}
.sheet-b{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 16px 24px;display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field>label{font-size:12px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;padding-inline-start:4px}
.inp{display:flex;align-items:center;background:var(--surface);border-radius:14px;padding:0 14px;box-shadow:var(--shadow);border:1.5px solid transparent}
.inp:focus-within{border-color:var(--accent)}
.inp input,.inp select,.inp textarea{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:17px;color:var(--ink);padding:14px 0;outline:none;font-variant-numeric:tabular-nums}
.inp textarea{font-size:14px;line-height:1.45;resize:vertical;min-height:120px}
.inp textarea.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;min-height:260px;direction:ltr;text-align:left}
.inp .sfx{color:var(--ink-3);font-weight:600;font-size:14px;margin-inline-start:8px}
.hint{font-size:12px;color:var(--ink-3);padding-inline-start:4px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}

.toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:18px;font-size:14px;font-weight:600;z-index:60;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.no-motion *{transition:none!important;animation:none!important}
.no-motion .tabbar nav.moving .tab-ind,.no-motion .tabbar nav.dragging .tab-ind{scale:1}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}.tabbar nav.moving .tab-ind,.tabbar nav.dragging .tab-ind{scale:1}}
@media (min-width:600px){.top h1{font-size:36px}}

<input type="file" id="restore-file" accept=".json,application/json" hidden>
<script>
{
const PREVIEW = false; /* build flag: true only in the Claude preview page */
const VERSION = "3.0";
const CACHE = "memo-finance-cache-v1"; /* same key as earlier versions, so existing data loads */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = v => { const n = Number(String(v ?? "").replace(/[^0-9.\-]/g, "")); return isFinite(n) ? n : 0; };
const fmt = n => Math.round(n).toLocaleString("en-US");
const compact = n => { const a = Math.abs(n); if (a >= 1e6) return (n / 1e6).toFixed(a >= 1e7 ? 1 : 2).replace(/\.?0+$/, "") + "M"; if (a >= 1e3) return Math.round(n / 1e3) + "K"; return fmt(n); };
const sum = a => a.reduce((x, y) => x + num(y), 0);
const uid = () => Math.random().toString(36).slice(2, 9);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const CHEV = '<svg class="chev" viewBox="0 0 7 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m1 1 5 5-5 5"/></svg>';
const TICK = '<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m3 7.5 2.5 2.5L11 4.5"/></svg>';
const svg = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const ICON = {
  home: '<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
  debts: '<rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 10h19M6.5 15h4"/>',
  budget: '<path d="M4 6h16M4 12h16M4 18h10"/>',
  savings: '<path d="M12 3 4 6v6c0 4.5 3.4 8.3 8 9 4.6-.7 8-4.5 8-9V6z"/><path d="m9 12 2 2 4-4"/>',
  history: '<rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4M8 14h3"/>',
  check: '<path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/>',
  spend: '<path d="M12 5v14M5 12h14"/>',
  goal: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
  up: '<path d="m6 15 6-6 6 6"/>', down: '<path d="m6 9 6 6 6-6"/>', eye: '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  eyeoff: '<path d="M3 3l18 18"/><path d="M10.6 5.1A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6C3.8 8.4 2 12 2 12s3.6 7 10 7a9.6 9.6 0 0 0 5.4-1.6"/>',
  edit: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>', trash: '<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>',
  move: '<path d="M5 9l-3 3 3 3M19 9l3 3-3 3M2 12h20"/>', plus: '<path d="M12 5v14M5 12h14"/>', code: '<path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/>'
};

/* ---------- language ---------- */
let LANG = "en";
const AR = {}; /* filled in i18n part */
function t(s, ...a) { let r = (LANG === "ar" && AR[s]) || s; a.forEach((v, i) => { r = r.split("{" + i + "}").join(v); }); return r; }
const locale = () => LANG === "ar" ? "ar-IQ-u-nu-latn" : "en-GB";

/* ---------- months ---------- */
const monthKey = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
const addMonths = (k, n) => { const [y, m] = k.split("-").map(Number); return monthKey(new Date(y, m - 1 + n, 1)); };
const monthDiff = (a, b) => { const [y1, m1] = a.split("-").map(Number), [y2, m2] = b.split("-").map(Number); return (y2 - y1) * 12 + (m2 - m1); };
const mDate = k => { const [y, m] = k.split("-").map(Number); return new Date(y, m - 1, 1); };
const monthLabel = k => mDate(k).toLocaleDateString(locale(), { month: "long", year: "numeric" });
const monthShort = k => mDate(k).toLocaleDateString(locale(), { month: "short", year: "numeric" });
const monthTiny = k => mDate(k).toLocaleDateString(locale(), { month: "short" });
const todayISO = () => { const d = new Date(); return `${monthKey(d)}-${String(d.getDate()).padStart(2, "0")}`; };

/* ---------- model ---------- */
const DEFAULT_SETTINGS = { theme: "system", accent: "teal", lang: "en", currency: "iqd", textSize: "m", tabLabels: true, motion: true, hideAmounts: false, dev: false, css: "", lastBackup: null, lockAfter: 0 };
const DEFAULT_LAYOUT = {
  home: ["home.hero", "home.actions", "home.alerts", "home.health", "home.split", "home.planactual", "home.due", "home.kpis"],
  debts: ["debts.kpis", "debts.plan", "debts.list", "debts.closed"],
  budget: ["budget.income", "budget.family", "budget.living", "budget.car", "budget.savingsplan", "budget.spending", "budget.totals"],
  savings: ["savings.networth", "savings.accounts", "savings.goals", "savings.ef"],
  history: ["history.kpis", "history.year", "history.trend", "history.months"]
};
const TABS = ["home", "debts", "budget", "savings", "history"];
function blank() {
  return { income: { salaryUSD: 0, ratePer100: 150000, payday: 1 }, family: [], living: [], custom: [], car: { fuel: 0, maintenance: 0, log: [] },
    emergency: { monthly: 0, log: [] }, goals: [], accounts: [], spending: [], checklist: {}, debts: [], months: {}, blocks: {}, layout: {}, settings: { ...DEFAULT_SETTINGS } };
}
function normalize(s) {
  const b = blank(); s = s || {};
  const items = arr => (Array.isArray(arr) ? arr : []).map(x => ({ id: x.id || uid(), name: x.name || "Item", amount: num(x.amount), ...(x.closedOn ? { closedOn: x.closedOn } : {}) }));
  const blocks = s.blocks && typeof s.blocks === "object" ? s.blocks : {};
  const custom = (Array.isArray(s.custom) ? s.custom : []).map(c => ({ id: c.id || uid(), name: c.name || "Section", color: c.color || "#E0A42E", inBudget: c.inBudget !== false, items: items(c.items) }));
  const out = {
    version: 3,
    income: { ...b.income, ...(s.income || {}) },
    family: items(s.family), living: items(s.living), custom,
    car: { ...b.car, ...(s.car || {}), log: Array.isArray(s.car?.log) ? s.car.log : [] },
    emergency: { ...b.emergency, ...(s.emergency || {}), log: Array.isArray(s.emergency?.log) ? s.emergency.log : [] },
    goals: (Array.isArray(s.goals) ? s.goals : []).map(g => ({ id: g.id || uid(), name: g.name || "Goal", target: num(g.target), monthly: num(g.monthly), deadline: g.deadline || "", contributions: Array.isArray(g.contributions) ? g.contributions : [] })),
    accounts: (Array.isArray(s.accounts) ? s.accounts : []).map(a => ({ id: a.id || uid(), name: a.name || "Account", type: a.type || "bank", balance: num(a.balance) })),
    spending: Array.isArray(s.spending) ? s.spending : [],
    checklist: s.checklist && typeof s.checklist === "object" ? s.checklist : {},
    plan: { extra: num(s.plan?.extra), strategy: s.plan?.strategy || "snowball" },
    debts: Array.isArray(s.debts) ? s.debts.map(d => ({ id: d.id || uid(), name: d.name || "Debt", total: num(d.total), installment: num(d.installment), ...(num(d.rate) ? { rate: num(d.rate) } : {}),
      payments: Array.isArray(d.payments) ? d.payments.map(p => ({ amount: num(p.amount), done: !!p.done, ...(p.done && p.paidOn ? { paidOn: p.paidOn } : {}) })) : [],
      ...(d.closedOn ? { closedOn: d.closedOn } : {}), ...(d.closedManual ? { closedManual: true } : {}) })) : [],
    months: s.months && typeof s.months === "object" ? s.months : {},
    blocks, settings: { ...DEFAULT_SETTINGS, ...(s.settings || {}) }, updatedAt: s.updatedAt || 0
  };
  /* Layout: keep the person's order, add any built-in block a newer version introduced, drop blocks that no longer exist. */
  const known = id => id.startsWith("custom:") ? custom.some(c => "custom:" + c.id === id) : id.startsWith("b_") ? !!blocks[id] : Object.values(DEFAULT_LAYOUT).some(l => l.includes(id));
  const layout = {};
  const placed = new Set();
  TABS.forEach(tb => {
    const saved = Array.isArray(s.layout?.[tb]) ? s.layout[tb].filter(e => e && known(e.id) && !placed.has(e.id)) : null;
    layout[tb] = saved ? saved.map(e => ({ id: e.id, hidden: !!e.hidden })) : DEFAULT_LAYOUT[tb].map(id => ({ id, hidden: false }));
    layout[tb].forEach(e => placed.add(e.id));
  });
  TABS.forEach(tb => DEFAULT_LAYOUT[tb].forEach((id, k) => { if (placed.has(id)) return;
    const prev = DEFAULT_LAYOUT[tb].slice(0, k).reverse().find(p => layout[tb].some(e => e.id === p));
    const at = prev ? layout[tb].findIndex(e => e.id === prev) + 1 : 0;
    layout[tb].splice(at, 0, { id, hidden: false }); placed.add(id); }));
  custom.forEach(c => { const id = "custom:" + c.id; if (!placed.has(id)) { layout.budget.splice(Math.max(0, layout.budget.findIndex(e => e.id === "budget.car")), 0, { id, hidden: false }); placed.add(id); } });
  Object.keys(blocks).forEach(id => { if (!placed.has(id)) { layout.home.push({ id, hidden: false }); placed.add(id); } });
  out.layout = layout;
  return out;
}

/* ---------- calculations ---------- */
const isOpen = x => !x.closedOn;
function debtInfo(d, cur) {
  const paid = sum(d.payments.filter(p => p.done).map(p => p.amount));
  const left = Math.max(0, d.total - paid);
  const pending = d.payments.filter(p => !p.done).length;
  const active = !d.closedOn && left > 0 && pending > 0;
  const paidThisMonth = d.payments.some(p => p.done && p.paidOn === cur);
  let doneBy = null;
  if (active) { const n = Math.min(pending, d.installment > 0 ? Math.ceil(left / d.installment) : pending); doneBy = addMonths(cur, n - (paidThisMonth ? 0 : 1)); }
  return { ...d, paid, left, pending, doneN: d.payments.length - pending, active, paidThisMonth, doneBy,
    nextIdx: d.payments.findIndex(p => !p.done), monthly: active ? d.installment : 0, pct: d.total ? Math.min(1, paid / d.total) : 0 };
}
function goalInfo(g, cur) {
  const saved = sum(g.contributions.map(x => x.amount));
  const left = Math.max(0, g.target - saved);
  const monthsLeft = g.deadline ? Math.max(1, monthDiff(cur, g.deadline) + 1) : null;
  const needed = monthsLeft ? left / monthsLeft : null;
  const thisMonth = sum(g.contributions.filter(x => x.month === cur).map(x => x.amount));
  const done = g.target > 0 && saved >= g.target;
  const late = !done && g.deadline && monthDiff(cur, g.deadline) < 0;
  const behind = !done && needed != null && g.monthly > 0 && needed > g.monthly * 1.05;
  return { ...g, saved, left, monthsLeft, needed, thisMonth, done, late, behind, pct: g.target ? Math.min(1, saved / g.target) : 0, monthlyPlan: done ? 0 : g.monthly };
}
/* Actual money out in one month, by category: logged spending, payments ticked, savings put aside. */
function actualFor(s, k) {
  const a = {};
  const add = (cat, v) => { a[cat] = (a[cat] || 0) + num(v); };
  s.spending.filter(x => x.month === k || String(x.date || "").startsWith(k)).forEach(x => add(x.cat || "other", x.amount));
  s.debts.forEach(d => d.payments.forEach(p => { if (p.done && p.paidOn === k) add("debt", p.amount); }));
  s.car.log.filter(x => String(x.date || "").startsWith(k)).forEach(x => add("car", x.amount));
  s.emergency.log.filter(x => x.month === k).forEach(x => add("ef", x.amount));
  s.goals.forEach(g => g.contributions.filter(x => x.month === k).forEach(x => add("goals", x.amount)));
  return a;
}
function calc(s) {
  const cur = monthKey();
  const rate = num(s.income.ratePer100);
  const salary = num(s.income.salaryUSD) / 100 * rate;
  const all = s.debts.map(d => debtInfo(d, cur));
  const debts = all.filter(isOpen);
  const family = s.family.filter(isOpen), living = s.living.filter(isOpen);
  const custom = s.custom.map(cs => ({ ...cs, open: cs.items.filter(isOpen) }));
  const goals = s.goals.map(g => goalInfo(g, cur));
  const cats = [
    { key: "debt", label: t("Debt installments"), value: sum(debts.map(d => d.monthly)), color: "var(--c-debt)", tab: "debts" },
    { key: "family", label: t("Family support"), value: sum(family.map(x => x.amount)), color: "var(--c-family)", tab: "budget" },
    { key: "living", label: t("Living expenses"), value: sum(living.map(x => x.amount)), color: "var(--c-living)", tab: "budget" },
    ...custom.filter(cs => cs.inBudget).map(cs => ({ key: "custom:" + cs.id, label: cs.name, value: sum(cs.open.map(x => x.amount)), color: cs.color, tab: "budget" })),
    { key: "car", label: t("Fuel & car"), value: num(s.car.fuel) + num(s.car.maintenance), color: "var(--c-car)", tab: "budget" },
    { key: "ef", label: t("Emergency fund"), value: num(s.emergency.monthly), color: "var(--c-ef)", tab: "savings" },
    { key: "goals", label: t("Savings goals"), value: sum(goals.map(g => g.monthlyPlan)), color: "var(--c-goal)", tab: "savings" }
  ].filter(c => c.value > 0 || ["debt", "family", "living", "car", "ef"].includes(c.key));
  const obligations = sum(cats.map(c => c.value));
  const remaining = salary - obligations;
  const finishes = debts.filter(d => d.doneBy).map(d => d.doneBy).sort();

/* Close fully paid debts, reopen un-ticked ones, keep this month's snapshot current. Past months keep their last snapshot. */
function syncState(s) {

  s.debts.forEach(d => {
    const paid = sum(d.payments.filter(p => p.done).map(p => p.amount));
    const full = d.payments.length > 0 && (Math.max(0, d.total - paid) <= 0 || d.payments.every(p => p.done));
    if (full && !d.closedOn) { d.closedOn = d.payments.map(p => p.paidOn).filter(Boolean).sort().pop() || cur; closed.push(d.name); }
    else if (!full && d.closedOn && !d.closedManual) delete d.closedOn;

  const c = calc(s), cats = Object.fromEntries(c.cats.map(x => [x.key, x.value]));
  s.debts.filter(d => d.closedOn === cur).forEach(d => { cats.debt = (cats.debt || 0) + sum(d.payments.filter(p => p.done && p.paidOn === cur).map(p => p.amount)); });
  ["family", "living"].forEach(l => s[l].filter(x => x.closedOn === cur).forEach(x => { cats[l] = (cats[l] || 0) + num(x.amount); }));
  const obligations = sum(Object.values(cats));
  s.months[cur] = { salary: c.salary, rate: c.rate, obligations, remaining: c.salary - obligations, cats,
    actual: c.actualTotal, netWorth: c.netWorth, debtLeft: c.debtLeft, efSaved: c.efSaved };
  return closed;
}

}
function lineChart(series, color = "var(--accent)") {

  const pts = series.map((x, i) => [i / (series.length - 1) * W, H - (x.value - lo) / (hi - lo || 1) * (H - 10) - 5]);
  const path = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");

    <div class="line-lbl"><span>${esc(series[0].label)}</span><span>${esc(series[Math.floor(series.length / 2)].label)}</span><span>${esc(last.label)}</span></div>`;
}

    <div class="legend">${series.map(x => `<div class="legend-row" style="grid-template-columns:10px minmax(0,1fr) auto"><span class="dot" style="background:${x.color}"></span><span>${esc(x.label)}</span><span class="amt-c">${M(x.value, true)}</span></div>`).join("")}</div></div>`;

function catLabel(c, k) { return c.cats.find(x => x.key === k)?.label || (k === "other" ? t("Other") : k === "goals" ? t("Savings goals") : k === "ef" ? t("Emergency fund") : state.custom.find(x => "custom:" + x.id === k)?.name || t("Other")); }
function catColor(c, k) { return c.cats.find(x => x.key === k)?.color || (k === "goals" ? "var(--c-goal)" : k === "ef" ? "var(--c-ef)" : "var(--c-other)"); }
function accountType(tp) { return { cash: t("Cash"), bank: t("Bank"), gold: t("Gold"), asset: t("Asset"), other: t("Other") }[tp] || tp; }
function debtCard(d) {
  const status = d.paidThisMonth && d.active ? `<span class="pill good">${t("Paid this month")}</span>` : !d.active ? `<span class="pill good">${t("Paid off")}</span>` : `<span class="pill warn">${t("{0} left", d.pending)}</span>`;
  return `<button class="debt" data-act="open-debt" data-id="${esc(d.id)}">
    <div class="debt-top"><div><h3>${esc(d.name)}</h3><div class="sub">${t("{0} / month", mtext(d.installment))} · ${t("{0} of {1} paid", d.doneN, d.payments.length)}${d.doneBy ? " · " + t("done {0}", monthShort(d.doneBy)) : ""}</div></div>${status}</div>
    <div class="prog ${!d.active ? "done" : ""}"><span style="width:${Math.round(d.pct * 100)}%"></span></div>
    <div class="debt-stats"><div><span>${t("Total")}</span><b>${M(d.total, true)}</b></div><div><span>${t("Paid")}</span><b>${M(d.paid, true)}</b></div><div><span>${t("Left")}</span><b>${M(d.left, true)}</b></div></div></button>`;
}
function listSection(key, title, items, color, sectionId) {
  const total = sum(items.map(x => x.amount));
  return `<section>${secH(esc(title), tot(Mu(total)))}<div class="list">
    ${items.map(x => row({ act: "edit-item", data: { list: key, id: x.id, ...(sectionId ? { sec: sectionId } : {}) }, name: esc(x.name), val: M(x.amount), icon: dot(color) })).join("")}
    <button class="row add" data-act="add-item" data-list="${key}" ${sectionId ? `data-sec="${esc(sectionId)}"` : ""}><span class="plus">+</span><span class="name">${t("Add item")}</span></button></div></section>`;
}
function monthCard(c, k) {
  const m = monthData(state, k), now = k === c.cur, sn = m.snap;
  const chips = [m.payments.length ? `<span class="chip">${t("{0} payments", m.payments.length)} · ${M(m.paidTotal, true)}</span>` : "",
    m.closed.length ? `<span class="chip good">${t("{0} closed", m.closed.length)}</span>` : "",
    m.spentTotal ? `<span class="chip">${t("Spent")} ${M(m.spentTotal, true)}</span>` : "",
    m.savedTotal ? `<span class="chip">${t("Saved")} ${M(m.savedTotal, true)}</span>` : ""].join("");
  return `<button class="mcard ${now ? "now" : ""}" data-act="open-month" data-k="${k}">
    <div class="debt-top"><div><h3>${monthLabel(k)}</h3><div class="sub">${now ? t("This month · updates as you go") : sn ? t("Closed month") : t("Activity only")}</div></div>${now ? `<span class="pill warn">${t("Open")}</span>` : `<span class="pill mute">${t("Closed")}</span>`}</div>
    ${sn ? `<div class="debt-stats"><div><span>${t("Salary")}</span><b>${M(sn.salary, true)}</b></div><div><span>${t("Obligations")}</span><b>${M(sn.obligations, true)}</b></div><div><span>${t("Left")}</span><b class="${sn.remaining < 0 ? "neg" : ""}">${M(sn.remaining, true)}</b></div></div>` : ""}
    ${chips ? `<div class="chips">${chips}</div>` : ""}</button>`;
}
function monthData(s, k) {
  const payments = [], closed = [];
  s.debts.forEach(d => {
    d.payments.forEach((p, i) => { if (p.done && p.paidOn === k) payments.push({ id: d.id, name: d.name, n: i + 1, amount: num(p.amount) }); });
    if (d.closedOn === k) closed.push({ kind: "debt", id: d.id, name: d.name, amount: d.total, manual: !!d.closedManual });
  });
  ["family", "living"].forEach(list => s[list].forEach(x => { if (x.closedOn === k) closed.push({ kind: list, id: x.id, name: x.name, amount: num(x.amount) }); }));
  s.custom.forEach(cs => cs.items.forEach(x => { if (x.closedOn === k) closed.push({ kind: "custom", sec: cs.id, secName: cs.name, id: x.id, name: x.name, amount: num(x.amount) }); }));
  const spent = s.spending.filter(x => (x.month || String(x.date).slice(0, 7)) === k);
  const car = s.car.log.filter(x => String(x.date || "").startsWith(k));
  const saved = [...s.emergency.log.filter(x => x.month === k).map(x => ({ name: x.label || t("Emergency fund"), amount: num(x.amount) })),
    ...s.goals.flatMap(g => g.contributions.filter(x => x.month === k).map(x => ({ name: g.name, amount: num(x.amount) })))];
  return { k, snap: s.months[k] || null, payments, closed, spent, car, saved, actual: actualFor(s, k),
    paidTotal: sum(payments.map(x => x.amount)), spentTotal: sum(spent.map(x => x.amount)) + sum(car.map(x => x.amount)), savedTotal: sum(saved.map(x => x.amount)) };
}
function monthKeys(s) {
  const keys = new Set(Object.keys(s.months));
  s.debts.forEach(d => { d.payments.forEach(p => p.paidOn && keys.add(p.paidOn)); d.closedOn && keys.add(d.closedOn); });
  ["family", "living"].forEach(l => s[l].forEach(x => x.closedOn && keys.add(x.closedOn)));
  s.custom.forEach(cs => cs.items.forEach(x => x.closedOn && keys.add(x.closedOn)));
  s.car.log.forEach(x => x.date && keys.add(String(x.date).slice(0, 7)));
  s.spending.forEach(x => keys.add(x.month || String(x.date).slice(0, 7)));
  s.emergency.log.forEach(x => x.month && keys.add(x.month));
  keys.add(monthKey());
  return [...keys].filter(k => /^\d{4}-\d{2}$/.test(k)).sort().reverse();
}

/* ---------- custom blocks (Developer mode) ---------- */
function blockInfo(id) {
  if (BLOCKS[id]) return { name: BLOCKS[id].name(), builtin: true, render: BLOCKS[id].render };
  if (id.startsWith("custom:")) {
    const cs = state.custom.find(x => "custom:" + x.id === id);
    return cs && { name: cs.name, builtin: false, kind: "section", render: c => listSection("custom:" + cs.id, cs.name + (cs.inBudget ? "" : " · " + t("not in budget")), cs.items.filter(isOpen), cs.color, cs.id) };
  }
  const b = state.blocks[id];
  if (!b) return null;
  if (b.type === "chart") return { name: b.title || CHART_SOURCES()[b.source]?.label || t("Chart"), builtin: false, kind: "chart", render: c => `<section>${secH(esc(b.title || CHART_SOURCES()[b.source]?.label || ""))}<div class="card">${chartFor(c, b.source, b.kind)}</div></section>` };
  if (b.type === "kpi") return { name: b.title || t("Number tiles"), builtin: false, kind: "kpi", render: c => { const ms = (b.metrics || []).filter(m => METRICS()[m]); return `<section>${b.title ? secH(esc(b.title)) : ""}<div class="kpis n${Math.min(3, ms.length) || 1}">${ms.map(m => kpi(METRICS()[m][0], METRICS()[m][1](c))).join("")}</div></section>`; } };
  if (b.type === "note") return { name: b.title || t("Note"), builtin: false, kind: "note", render: () => `<section>${b.title ? secH(esc(b.title)) : ""}<div class="card note-card">${esc(b.text || "")}</div></section>` };
  return null;
}

/* ---------- render ---------- */
function render() {
  const T = TITLES();
  const nav = $("#tabs");
  if (!nav.querySelector(".tab")) nav.insertAdjacentHTML("beforeend", TABS.map(k => `<button class="tab" data-act="tab" data-tab="${k}">${svg(ICON[k])}<span></span></button>`).join(""));
  nav.querySelectorAll(".tab").forEach(b => { b.querySelector("span").textContent = T[b.dataset.tab]; b.setAttribute("aria-current", b.dataset.tab === tab ? "page" : "false"); });
  nav.style.setProperty("--i", TABS.indexOf(tab));
  $("#title").textContent = T[tab]; $("#topbar").textContent = T[tab];
  $("#eyebrow").textContent = new Date().toLocaleDateString(locale(), { month: "long", year: "numeric" });
  const v = $("#view");
  if (!state) { v.innerHTML = emptyView(); return; }
  const c = calc(state), dev = !!state.settings.dev;
  const layout = state.layout[tab] || [];
  const parts = layout.map((e, i) => {
    const info = blockInfo(e.id); if (!info) return "";
    if (!dev) return e.hidden ? "" : info.render(c);
    const body = info.render(c) || `<p class="note">${t("(Empty right now)")}</p>`;
    return `<div class="blk ${e.hidden ? "is-hidden" : ""}"><div class="dev-bar"><span class="nm">${esc(info.name)}${e.hidden ? " · " + t("hidden") : ""}</span>
      <button data-act="blk-up" data-i="${i}" aria-label="${t("Move up")}" ${i === 0 ? "disabled style=opacity:.35" : ""}>${svg(ICON.up)}</button>
      <button data-act="blk-down" data-i="${i}" aria-label="${t("Move down")}" ${i === layout.length - 1 ? "disabled style=opacity:.35" : ""}>${svg(ICON.down)}</button>

/* ---------- sheets ---------- */
function openSheet(s) { sheets.push(s); renderSheet(true); }
function closeSheet() { sheets.pop(); if (!sheets.length) closeSheetsAll(); else renderSheet(true); }
function closeSheetsAll() { sheets.length = 0; const sh = $("#sheet"), sc = $("#scrim"); sh.classList.remove("on"); sc.classList.remove("on"); setTimeout(() => { if (!sheets.length) { sh.hidden = true; sc.hidden = true; sh.innerHTML = ""; } }, 300); }
function renderSheet(fresh) {
  if (!sheets.length) return;
  const s = sheets[sheets.length - 1], sh = $("#sheet"), sc = $("#scrim");
  if (s.kind === "form" && !fresh) return; /* never clobber typing */
  const body = sh.querySelector(".sheet-b"), keep = !fresh && body ? body.scrollTop : 0;
  const title = typeof s.title === "function" ? s.title() : s.title;
  sh.innerHTML = `<div class="grab"></div><div class="sheet-h"><button data-act="sheet-close">${sheets.length > 1 ? t("Back") : s.kind === "form" ? t("Cancel") : t("Close")}</button><h3>${esc(title)}</h3>${s.kind === "form" ? `<button data-act="form-save" style="font-weight:700">${t("Save")}</button>` : `<span class="sp"></span>`}</div><div class="sheet-b">${s.body()}</div>`;
  sh.querySelector(".sheet-b").scrollTop = keep;
  if (sh.hidden) { sh.hidden = false; sc.hidden = false; requestAnimationFrame(() => { sh.classList.add("on"); sc.classList.add("on"); }); }
}
/* Generic form. Field types: text, money, int, date, month, select, toggle, textarea, code, color, multi. */
function form({ title, fields, onSave, onDelete, deleteLabel, note = "", extra = null }) {
  openSheet({ kind: "form", title, fields, onSave, onDelete, extra, armed: false,
    body: () => fields.map(f => {
      const id = "f-" + f.id, opts = (f.options || []).map(o => typeof o === "object" ? o : { value: o, label: o });
      if (f.type === "toggle") return `<label class="switch" for="${id}"><span>${esc(f.label)}</span><span class="toggle"><input type="checkbox" id="${id}" ${f.value ? "checked" : ""}><span></span></span></label>`;
      if (f.type === "select") return `<div class="field"><label for="${id}">${esc(f.label)}</label><div class="inp"><select id="${id}">${opts.map(o => `<option value="${esc(o.value)}" ${o.value === f.value ? "selected" : ""}>${esc(o.label)}</option>`).join("")}</select></div>${f.hint ? `<div class="hint">${esc(f.hint)}</div>` : ""}</div>`;
      if (f.type === "color") return `<div class="field"><label>${esc(f.label)}</label><div class="swatches" id="${id}" data-value="${esc(f.value)}">${opts.map(o => `<button type="button" class="sw ${o.value === f.value ? "on" : ""}" style="background:${o.value}" data-act="pick-color" data-v="${esc(o.value)}" aria-label="${esc(o.label || o.value)}"></button>`).join("")}</div></div>`;
      if (f.type === "textarea" || f.type === "code") return `<div class="field"><label for="${id}">${esc(f.label)}</label><div class="inp"><textarea id="${id}" class="${f.type === "code" ? "code" : ""}" spellcheck="false" placeholder="${esc(f.placeholder || "")}">${esc(f.value ?? "")}</textarea></div>${f.hint ? `<div class="hint">${esc(f.hint)}</div>` : ""}</div>`;
      const v = f.type === "money" ? (f.value === "" || f.value == null ? "" : fmt(f.value)) : (f.value ?? "");
      const typeAttr = f.type === "date" ? 'type="date"' : f.type === "month" ? 'type="month"' : f.type === "text" ? 'type="text" autocomplete="off"' : f.type === "pin" ? 'type="password" inputmode="numeric" maxlength="4" autocomplete="off" style="letter-spacing:.5em"' : 'type="text" inputmode="numeric" autocomplete="off"';
      return `<div class="field"><label for="${id}">${esc(f.label)}</label><div class="inp">${f.prefix ? `<span class="sfx" style="margin:0 6px 0 0">${f.prefix}</span>` : ""}<input id="${id}" ${typeAttr} class="${f.type === "money" ? "money" : ""}" value="${esc(v)}" placeholder="${esc(f.placeholder || "")}">${f.suffix ? `<span class="sfx">${esc(f.suffix)}</span>` : ""}</div>${f.hint ? `<div class="hint">${esc(f.hint)}</div>` : ""}</div>`;
    }).join("") + (note ? `<p class="note">${note}</p>` : "") + `<button class="btn" data-act="form-save">${t("Save")}</button>`
      + (extra ? `<button class="btn ghost" data-act="form-extra">${esc(extra.label)}</button>${extra.hint ? `<p class="note" style="margin-top:-8px">${esc(extra.hint)}</p>` : ""}` : "")
      + (onDelete ? `<button class="btn danger" data-act="form-delete">${esc(deleteLabel || t("Delete"))}</button>` : "") });
}
function readForm(s) {
  const out = {};
  s.fields.forEach(f => {
    const el = document.getElementById("f-" + f.id);
    out[f.id] = f.type === "toggle" ? el.checked : f.type === "color" ? el.dataset.value : (f.type === "money" || f.type === "int") ? num(el.value) : f.type === "code" || f.type === "textarea" ? el.value : el.value.trim();
  });
  return out;
}

      ${d.closedOn ? `<div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:10px"><span><b>${t("Closed in {0}", monthLabel(d.closedOn))}</b><span class="note" style="display:block;padding:0">${d.closedManual ? t("Closed early by you") : t("Fully paid")} · ${t("kept in History")}</span></span>${d.closedManual ? `<button class="mini-btn" data-act="reopen-debt" data-id="${esc(id)}">${t("Reopen")}</button>` : ""}</div>`
        : next ? `<button class="btn" data-act="pay-next" data-id="${esc(id)}">${t("Mark month {0} as paid", d.nextIdx + 1)} · ${mtext(d.payments[d.nextIdx].amount)}</button>${d.doneBy ? `<p class="note" style="text-align:center;margin-top:-6px">${t("On schedule, this debt is done in {0}.", monthLabel(d.doneBy))}</p>` : ""}` : ""}
      <section>${secH(t("Schedule"), tot(t("Tap a circle to toggle")))}<div class="list sched">${d.payments.map((p, i) => `<div class="row ${i === d.nextIdx && next ? "next" : ""}">
          <button class="check ${p.done ? "on" : ""}" data-act="toggle-pay" data-id="${esc(id)}" data-i="${i}" aria-pressed="${p.done}" aria-label="${t("Month {0}", i + 1)}">${TICK}</button>

          <button class="amtbtn" data-act="edit-pay" data-id="${esc(id)}" data-i="${i}">${M(p.amount)}</button></div>`).join("")}</div></section>
      ${d.total && Math.abs(d.installment * d.payments.length - d.total) > 1 && d.payments.every(p => p.amount === d.installment) ? `<p class="note">${t("{0} months × {1} = {2} IQD, which differs from the total of {3} IQD. Edit the debt if one of these is off.", d.payments.length, fmt(d.installment), fmt(d.installment * d.payments.length), fmt(d.total))}</p>` : ""}
      <div class="btn-row"><button class="btn ghost" data-act="edit-debt" data-id="${esc(id)}">${t("Edit debt")}</button><button class="btn danger" data-act="delete-debt" data-id="${esc(id)}">${t("Delete")}</button></div>
      ${!d.closedOn ? `<button class="btn ghost" data-act="close-debt" data-id="${esc(id)}">${t("Close debt now")}</button><p class="note" style="margin-top:-8px">${t("For a debt you settled early or that was forgiven. It moves to {0} in History, and you can reopen it there.", monthLabel(monthKey()))}</p>` : ""}`;

function editDebt(id) {
  const d = id ? state.debts.find(x => x.id === id) : null, doneN = d ? d.payments.filter(p => p.done).length : 0;
  const fields = [
    { id: "name", label: t("Name"), type: "text", value: d?.name || "", placeholder: t("e.g. Phone") },
    { id: "total", label: t("Total debt"), type: "money", value: d?.total ?? "", suffix: t("IQD") },
    { id: "installment", label: t("Monthly installment"), type: "money", value: d?.installment ?? "", suffix: t("IQD") },
    { id: "months", label: t("Number of months"), type: "int", value: d ? d.payments.length : "" },
    { id: "rate", label: t("Interest rate, % per year (optional)"), type: "text", value: d?.rate || "", placeholder: "0", hint: t("Leave empty for interest-free installments. Used by the payoff plan.") }];
  fields.push(d ? { id: "apply", label: t("Use new installment for unpaid months"), type: "toggle", value: true } : { id: "paidN", label: t("Months already paid"), type: "int", value: 0 });
  form({ title: d ? t("Edit debt") : t("New debt"), fields, onSave: v => {
    if (!v.name) return t("Enter a name.");
    if (v.months < 1 || v.months > 360) return t("Number of months must be between 1 and 360.");
    if (d) {
      if (v.months < doneN) return t("This debt already has {0} paid months. Set at least {0}.", doneN);
      commit(s => { const x = s.debts.find(y => y.id === id); x.name = v.name; x.total = v.total; if (num(v.rate)) x.rate = num(v.rate); else delete x.rate;
        if (v.apply) x.payments.forEach(p => { if (!p.done) p.amount = v.installment; });
        x.installment = v.installment;
        while (x.payments.length < v.months) x.payments.push({ amount: v.installment, done: false });
        if (x.payments.length > v.months) { const keep = []; let drop = x.payments.length - v.months; for (let i = x.payments.length - 1; i >= 0; i--) { if (drop > 0 && !x.payments[i].done) { drop--; continue; } keep.unshift(x.payments[i]); } x.payments = keep; }
      }, t("Debt updated"));
    } else {
      const paidN = Math.min(v.months, Math.max(0, v.paidN));
      commit(s => s.debts.push({ id: uid(), name: v.name, total: v.total, installment: v.installment, ...(num(v.rate) ? { rate: num(v.rate) } : {}), payments: Array.from({ length: v.months }, (_, i) => ({ amount: v.installment, done: i < paidN })) }), t("Debt added"));
    }
  } });
}

      ${groups.map(g => `<section>${secH(esc(g))}<div class="list">${items.filter(x => x.group === g).map(x => `<button class="row ${x.done ? "done" : ""}" data-act="check" data-key="${esc(x.key)}"><span class="check ${x.done ? "on" : ""}">${TICK}</span><span class="name">${esc(x.name)}</span><span class="val">${M(x.amount)}</span></button>`).join("")}</div></section>`).join("") || `<p class="note">${t("Nothing planned yet. Add items in Budget.")}</p>`}

function toggleCheck(key) {
  const cur = monthKey();
  commit(s => {
    const c = calc(s), item = c.checklist.find(x => x.key === key); if (!item) return;
    if (key.startsWith("debt:")) {
      const d = s.debts.find(x => x.id === key.slice(5));
      if (item.done) { const p = [...d.payments].reverse().find(p => p.done && p.paidOn === cur); if (p) { p.done = false; delete p.paidOn; } }
      else { const p = d.payments.find(p => !p.done); if (p) { p.done = true; p.paidOn = cur; } }
      return;
    }
    s.checklist[cur] = s.checklist[cur] || {};
    if (item.done) {
      delete s.checklist[cur][key];
      s.spending = s.spending.filter(x => !(x.src === key && x.month === cur));
      s.emergency.log = s.emergency.log.filter(x => !(x.src === key && x.month === cur));
      s.goals.forEach(g => { g.contributions = g.contributions.filter(x => !(x.src === key && x.month === cur)); });
    } else {
      s.checklist[cur][key] = true;
      if (key === "ef") s.emergency.log.push({ label: monthLabel(cur), amount: item.amount, month: cur, src: key });
      else if (key.startsWith("goal:")) s.goals.find(g => g.id === key.slice(5))?.contributions.push({ month: cur, amount: item.amount, src: key });
      else s.spending.push({ id: uid(), date: todayISO(), month: cur, cat: item.cat, amount: item.amount, note: item.name, src: key });
    }
  });
}

/* =================== Payoff plan =================== */
/* Month-by-month simulation of the open debts.
   schedule: installments only. snowball: extra money and freed installments go to the smallest balance.
   avalanche: same, but to the highest interest rate first (smallest balance breaks ties). */
function simulate(s, strategy = "schedule", extra = 0) {
  const cur = monthKey(), c = calc(s);
  const ds = c.debts.filter(d => d.active).map(d => ({ id: d.id, name: d.name, bal: d.left, inst: Math.max(1, d.installment || d.left), rate: num(d.rate) / 1200, skip: d.paidThisMonth, done: null }));
  if (!ds.length) return { months: 0, finishBy: null, order: [], interest: 0, total: 0 };
  let freed = 0, interest = 0, total = 0;
  for (let m = 0; m < 600 && ds.some(d => d.done == null); m++) {
    ds.forEach(d => { if (d.done == null && d.rate) { const i = d.bal * d.rate; d.bal += i; interest += i; } });
    ds.forEach(d => { if (d.done == null && !(m === 0 && d.skip)) { const p = Math.min(d.inst, d.bal); d.bal -= p; total += p; } });
    if (strategy !== "schedule") {
      let pool = extra + freed;
      const order = ds.filter(d => d.done == null && d.bal > 0.5).sort((a, b) => strategy === "avalanche" ? (b.rate - a.rate) || (a.bal - b.bal) : (a.bal - b.bal) || (b.rate - a.rate));
      for (const d of order) { if (pool <= 0) break; const p = Math.min(pool, d.bal); d.bal -= p; pool -= p; total += p; }
    }
    ds.forEach(d => { if (d.done == null && d.bal <= 0.5) { d.done = m; if (strategy !== "schedule") freed += d.inst; } });
  }
  const last = Math.max(...ds.map(d => d.done ?? 599));
  return { months: last + 1, finishBy: addMonths(cur, last), interest, total,
    order: [...ds].sort((a, b) => (a.done ?? 999) - (b.done ?? 999)).map(d => ({ id: d.id, name: d.name, by: addMonths(cur, d.done ?? 599) })) };
}
const planOf = () => ({ extra: 0, strategy: "snowball", ...(state.plan || {}) });
BLOCKS["debts.plan"] = { name: () => t("Payoff plan"), render: c => {
  if (!c.debts.some(d => d.active)) return "";
  const pl = planOf(), base = simulate(state, "schedule"), sn = simulate(state, "snowball", pl.extra), av = simulate(state, "avalanche", pl.extra);
  const saved = r => base.months - r.months;
  const line = (label, sub, r, key) => row({ act: "plan", data: { s: key }, name: label, sub, val: `${monthShort(r.finishBy)}${key !== "schedule" && saved(r) > 0 ? ` <span class="paid-tag">−${saved(r)} ${t("mo")}</span>` : ""}` });
  return `<section>${secH(t("Payoff plan"), tot(pl.extra ? t("+{0} extra / month", mtext(pl.extra, true)) : ""))}<div class="list">
    ${line(t("On schedule"), t("Installments only"), base, "schedule")}
    ${line(t("Smallest debt first"), t("Snowball: quick wins, then roll each freed installment on"), sn, "snowball")}
    ${line(t("Highest interest first"), t("Avalanche: pays the least interest"), av, "avalanche")}</div>
    ${pl.extra ? "" : `<p class="note" style="margin-top:8px">${t("Tap a plan and add an extra monthly amount to see how much sooner you could be debt-free.")}</p>`}</section>`;
} };
function planSheet(strategy) {
  openSheet({ kind: "view", plan: true, title: t("Payoff plan"), body: () => {
    const pl = planOf(), st = strategy || pl.strategy, base = simulate(state, "schedule"), r = st === "schedule" ? base : simulate(state, st, pl.extra);
    const hasRates = state.debts.some(d => num(d.rate) > 0);

      <p class="note">${st === "snowball" ? t("Pay every installment, then put any extra money on the smallest debt. When it's gone, its installment moves to the next smallest.") : st === "avalanche" ? t("Pay every installment, then put any extra money on the debt with the highest interest rate.") : t("This is when each debt ends if you only pay the agreed installments.")}${st === "avalanche" && !hasRates ? " " + t("None of your debts has an interest rate yet, so this matches Smallest first. Add rates under Edit debt to compare.") : ""}</p>

}

function exportICS(day, hour, each) {

    `RRULE:FREQ=MONTHLY${count ? ";COUNT=" + count : ""}`, `SUMMARY:${escI(summary)}`, `DESCRIPTION:${escI(desc)}`,
    "BEGIN:VALARM", `TRIGGER;RELATED=START:PT${hour}H`, "ACTION:DISPLAY", `DESCRIPTION:${escI(summary)}`, "END:VALARM", "END:VEVENT"];
  const items = c.checklist.filter(x => !x.key.startsWith("debt:") || !each);

    ...ev("payday", t("Payday checklist") + " · " + fmt(sum(items.map(x => x.amount))) + " IQD", items.map(x => `${x.name}: ${fmt(x.amount)} IQD`).join("\n") + "\n\n" + t("Open Memo Finance and tick each payment."), 0),
    ...(each ? c.debts.filter(d => d.active).flatMap(d => ev("debt-" + d.id, `${t("Pay")} ${d.name} · ${fmt(d.installment)} IQD`, t("{0} left after this", fmt(Math.max(0, d.left - d.installment))) + " IQD", d.pending)) : []),

/* =================== PIN lock =================== */
/* A privacy screen: it stops someone who picks up your phone from seeing your numbers.
   The data itself is not encrypted, so keep exporting backups. */
async function hashPin(pin) {
  const msg = "memo-finance:" + pin;
  try { if (crypto?.subtle) { const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(msg)); return "s" + [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join(""); } } catch (_) {}
  let h = 2166136261; for (const ch of msg) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return "f" + (h >>> 0).toString(16);
}
let lockEntry = "", lockedAt = 0, hiddenAt = 0;
function lockNow() {
  if (!state || !state.settings.pinHash) return;
  lockEntry = ""; let el = $("#lock");
  if (!el) { el = document.createElement("div"); el.id = "lock"; document.body.appendChild(el); }
  el.hidden = false; drawLock();
}
function drawLock(msg = "") {
  const el = $("#lock"); if (!el) return;
  el.innerHTML = `<div class="lock-in"><div class="lock-ic">${svg('<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>')}</div>
    <h2>${t("Enter your PIN")}</h2><div class="dots ${msg ? "shake" : ""}">${[0, 1, 2, 3].map(i => `<i class="${i < lockEntry.length ? "on" : ""}"></i>`).join("")}</div>
    <p class="lock-msg">${esc(msg)}</p>
    <div class="pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9, "", 0, "⌫"].map(k => k === "" ? "<span></span>" : `<button data-act="pin-key" data-k="${k}" aria-label="${k === "⌫" ? t("Delete") : k}">${k}</button>`).join("")}</div>
    <button class="lock-forgot" data-act="pin-forgot">${t("Forgot PIN?")}</button></div>`;
}
async function pinKey(k) {
  if (k === "⌫") { lockEntry = lockEntry.slice(0, -1); drawLock(); return; }
  if (lockEntry.length >= 4) return;
  lockEntry += k; drawLock();
  if (lockEntry.length === 4) {
    const ok = (await hashPin(lockEntry)) === state.settings.pinHash;
    if (ok) { $("#lock").hidden = true; lockEntry = ""; lockedAt = 0; }
    else { lockEntry = ""; setTimeout(() => drawLock(t("Wrong PIN. Try again.")), 120); }
  }
}
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  const after = num(state?.settings?.lockAfter) * 60000;
  if (state?.settings?.pinHash && hiddenAt && Date.now() - hiddenAt >= after) lockNow();
});
function pinForm(mode) {
  const st = state.settings;
  if (mode === "set") form({ title: st.pinHash ? t("Change PIN") : t("Set a PIN"), fields: [
      { id: "a", label: t("New PIN (4 digits)"), type: "pin", value: "" }, { id: "b", label: t("Repeat the PIN"), type: "pin", value: "" }],
    note: t("If you forget it, the only way back in is to erase the data on this phone and restore a backup. Export a backup first."),
    onSave: v => { if (!/^\d{4}$/.test(v.a)) return t("The PIN must be 4 digits."); if (v.a !== v.b) return t("The two PINs don't match.");
      hashPin(v.a).then(h => commit(s => { s.settings.pinHash = h; s.settings.lockAfter = s.settings.lockAfter ?? 0; }, t("PIN lock is on"))); } });
  else form({ title: t("Turn off PIN lock"), fields: [{ id: "a", label: t("Current PIN"), type: "pin", value: "" }],
    onSave: v => { const top = sheets[sheets.length - 1];
      hashPin(v.a).then(h => { if (h !== state.settings.pinHash) { toast(t("Wrong PIN. Try again.")); return; } commit(s => { delete s.settings.pinHash; }, t("PIN lock is off")); });
      return undefined; } });
}
