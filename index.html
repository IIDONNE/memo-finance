const FIELDS = () => ({
  salaryUSD: { label: t("Monthly salary"), type: "money", prefix: "$", get: s => s.income.salaryUSD, set: (s, v) => { s.income.salaryUSD = v; } },
  ratePer100: { label: t("IQD per $100"), type: "money", suffix: t("IQD"), hint: t("Use the rate you actually get when you exchange your salary."), get: s => s.income.ratePer100, set: (s, v) => { s.income.ratePer100 = v; } },
  payday: { label: t("Payday (day of month)"), type: "int", hint: t("After this day, unticked checklist items show in Attention."), get: s => s.income.payday || 1, set: (s, v) => { s.income.payday = clamp(Math.round(v) || 1, 1, 31); } },
  fuel: { label: t("Monthly fuel"), type: "money", suffix: t("IQD"), get: s => s.car.fuel, set: (s, v) => { s.car.fuel = v; } },
  maintenance: { label: t("Maintenance reserve"), type: "money", suffix: t("IQD"), get: s => s.car.maintenance, set: (s, v) => { s.car.maintenance = v; } },
  efMonthly: { label: t("Emergency fund per month"), type: "money", suffix: t("IQD"), get: s => s.emergency.monthly, set: (s, v) => { s.emergency.monthly = v; } }
});
/* Item lists: family, living, or a custom section ("custom:<id>"). */
function listRef(s, list) { if (list === "family" || list === "living") return { items: s[list], title: list === "family" ? t("Family support") : t("Living expenses") }; const cs = s.custom.find(x => "custom:" + x.id === list); return cs ? { items: cs.items, title: cs.name, cs } : null; }

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const a = b.dataset.act, top = sheets[sheets.length - 1], d = b.dataset;
  const needState = !["settings", "set", "import", "start", "sheet-close", "toggle-hide", "tab"].includes(a);
  if (needState && !state) return;
  switch (a) {
    case "tab": goTab(d.tab); break;
    case "start": state = normalize(blank()); commit(() => {}, t("Tracker created")); break;
    case "settings": settingsSheet(); break;
    case "set": { const k = d.k, v = d.v; if (!state) { state = normalize(blank()); } commit(s => { s.settings[k] = v; }); break; }
    case "toggle-hide": if (state) commit(s => { s.settings.hideAmounts = !s.settings.hideAmounts; }, state.settings.hideAmounts ? t("Amounts shown") : t("Amounts hidden")); break;
    case "open-debt": debtSheet(d.id); break;
    case "add-debt": editDebt(null); break;
    case "edit-debt": editDebt(d.id); break;
    case "delete-debt":
      if (!b.classList.contains("armed")) { b.classList.add("armed"); b.textContent = t("Tap again to delete"); setTimeout(() => { if (b.isConnected) { b.classList.remove("armed"); b.textContent = t("Delete"); } }, 3000); break; }
      { const id = d.id; closeSheetsAll(); commit(s => { s.debts = s.debts.filter(x => x.id !== id); }, t("Debt deleted")); } break;
    case "pay-next": { const dd = state.debts.find(x => x.id === d.id), n = dd.payments.findIndex(p => !p.done) + 1;
      commit(s => { const p = s.debts.find(x => x.id === d.id).payments.find(p => !p.done); if (p) { p.done = true; p.paidOn = monthKey(); } }, t("Month {0} marked as paid", n)); break; }
    case "toggle-pay": commit(s => { const p = s.debts.find(x => x.id === d.id).payments[+d.i]; p.done = !p.done; if (p.done) p.paidOn = monthKey(); else delete p.paidOn; }); break;
    case "edit-pay": { const id = d.id, i = +d.i, p = state.debts.find(x => x.id === id).payments[i];
      form({ title: t("Month {0}", i + 1), fields: [{ id: "amount", label: t("Payment amount"), type: "money", value: p.amount, suffix: t("IQD") }, { id: "done", label: t("Paid"), type: "toggle", value: p.done }],
        onSave: v => commit(s => { const q = s.debts.find(x => x.id === id).payments[i]; q.amount = v.amount; if (v.done && !q.done) q.paidOn = monthKey(); if (!v.done) delete q.paidOn; q.done = v.done; }, t("Payment updated")) }); break; }
    case "close-debt": commit(s => { const x = s.debts.find(y => y.id === d.id); x.closedOn = monthKey(); x.closedManual = true; }, t("Closed. Moved to {0} in History.", monthLabel(monthKey()))); break;
    case "reopen-debt": commit(s => { const x = s.debts.find(y => y.id === d.id); delete x.closedOn; delete x.closedManual; }, t("Debt reopened")); break;
    case "restore-item": commit(s => { const r = listRef(s, d.list), x = r && r.items.find(y => y.id === d.id); if (x) delete x.closedOn; }, t("Restored to Budget")); break;
    case "edit-field": { const f = FIELDS()[d.f]; form({ title: f.label, fields: [{ id: "v", ...f, value: f.get(state) }], onSave: v => commit(s => f.set(s, v.v), t("Updated")) }); break; }
    case "edit-item": case "add-item": {
      const list = d.list, id = d.id, r = listRef(state, list); if (!r) break;
      const x = id ? r.items.find(y => y.id === id) : null;
      form({ title: x ? x.name : t("New item in {0}", r.title),
        fields: [{ id: "name", label: t("Name"), type: "text", value: x?.name || "" }, { id: "amount", label: t("Monthly amount"), type: "money", value: x?.amount ?? "", suffix: t("IQD") }],
        onSave: v => { if (!v.name) return t("Enter a name."); commit(s => { const rr = listRef(s, list); if (x) Object.assign(rr.items.find(y => y.id === id), v); else rr.items.push({ id: uid(), ...v }); }, x ? t("Updated") : t("Added")); },
        onDelete: x ? () => commit(s => { const rr = listRef(s, list); const i = rr.items.findIndex(y => y.id === id); if (i >= 0) rr.items.splice(i, 1); }, t("Deleted")) : null, deleteLabel: t("Delete completely"),
        extra: x ? { label: t("End this month"), hint: t("Stops counting it from now on and keeps it in History under {0}.", monthLabel(monthKey())), run: () => commit(s => { listRef(s, list).items.find(y => y.id === id).closedOn = monthKey(); }, t("{0} ended. Moved to {1} in History.", x.name, monthLabel(monthKey()))) } : null });
      break; }
    case "car-log": carLogSheet(); break;
    case "edit-log": editLog(d.id); break;
    case "ef-month": { const i = +d.i, x = state.emergency.log[i];
      form({ title: x.label || t("Month {0}", i + 1), fields: [{ id: "label", label: t("Label"), type: "text", value: x.label || "" }, { id: "amount", label: t("Amount saved"), type: "money", value: x.amount, suffix: t("IQD") }],
        onSave: v => commit(s => { Object.assign(s.emergency.log[i], { label: v.label || x.label, amount: v.amount }); }, t("Saved")),
        onDelete: () => commit(s => { s.emergency.log.splice(i, 1); }, t("Deleted")), deleteLabel: t("Remove") }); break; }
    case "ef-add": { const k = monthKey(), lbl = monthLabel(k);
      form({ title: lbl, fields: [{ id: "amount", label: t("Amount saved"), type: "money", value: num(state.emergency.monthly) || "", suffix: t("IQD") }],
        onSave: v => commit(s => { s.emergency.log.push({ label: lbl, amount: v.amount, month: k }); }, t("Saved to {0}", lbl)) }); break; }
    case "checklist": checklistSheet(); break;
    case "plan": { if (top && top.plan) sheets.pop(); planSheet(d.s); break; }
    case "plan-extra": form({ title: t("Extra each month"), fields: [{ id: "v", label: t("Amount"), type: "money", value: planOf().extra || "", suffix: t("IQD"), hint: t("For example the money left after obligations, or part of it.") }],
        onSave: v => commit(s => { s.plan = { ...planOf(), extra: v.v }; }, t("Updated")) }); break;
    case "plan-use": commit(s => { s.plan = { ...planOf(), strategy: d.s }; }, t("Plan saved")); break;
    case "what-if": whatIfSheet(); break;
    case "wi-apply": { const w = top && top.wi; if (!w) break; commit(s => { s.income.salaryUSD = w.salary; if (w.rate) s.income.ratePer100 = w.rate; }, t("Salary and rate updated")); closeSheetsAll(); break; }
    case "reminders": remindersForm(); break;
    case "year": yearSheet(d.y); break;
    case "pin-set": pinForm("set"); break;
    case "pin-off": pinForm("off"); break;
    case "pin-lock": closeSheetsAll(); lockNow(); break;
    case "pin-key": pinKey(d.k); break;
    case "pin-forgot": { const el = $("#lock .lock-msg"); if (!el) break;
      if (!b.classList.contains("armed")) { b.classList.add("armed"); b.textContent = t("Tap again to erase the data on this phone"); el.textContent = t("This erases everything here. You can then restore your last backup."); break; }
      try { localStorage.removeItem(CACHE); } catch (_) {} location.reload(); break; }
    case "check": toggleCheck(d.key); break;
    case "log-spend": spendForm(null); break;
    case "edit-spend": spendForm(d.id); break;
    case "goal-new": goalForm(null); break;
    case "goal-edit": goalForm(d.id); break;
    case "open-goal": goalSheet(d.id); break;
    case "goal-add": { const id = d.id, g = state.goals.find(x => x.id === id), k = monthKey();
      form({ title: t("Add to {0}", g.name), fields: [{ id: "amount", label: t("Amount"), type: "money", value: g.monthly || "", suffix: t("IQD") }],
        onSave: v => { if (!v.amount) return t("Enter an amount."); commit(s => { s.goals.find(x => x.id === id).contributions.push({ month: k, amount: v.amount }); }, t("Added to {0}", g.name)); } }); break; }
    case "edit-account": accountForm(d.id); break;
    case "open-month": monthSheet(d.k); break;
    case "export": exportBackup(); break;
    case "export-xlsx": exportExcel(); break;
    case "import": $("#restore-file").click(); break;
    case "erase":
      if (!b.classList.contains("armed")) { b.classList.add("armed"); b.textContent = t("Tap again to erase everything"); break; }
      try { localStorage.removeItem(CACHE); } catch (_) {}
      state = null; closeSheetsAll(); applySettings(); render(); toast(t("All data erased")); break;
    /* developer mode */
    case "dev-off": commit(s => { s.settings.dev = false; }); break;
    case "blk-up": case "blk-down": { const i = +d.i, j = a === "blk-up" ? i - 1 : i + 1; commit(s => { const L = s.layout[tab]; if (j >= 0 && j < L.length) [L[i], L[j]] = [L[j], L[i]]; }); break; }
    case "blk-hide": commit(s => { const e = s.layout[tab][+d.i]; e.hidden = !e.hidden; }); if (top && top.title === t("Add block")) closeSheetsAll(); break;
    case "blk-move": moveBlockForm(+d.i); break;
    case "blk-edit": { const id = state.layout[tab][+d.i].id; blockForm(id.startsWith("custom:") ? "section" : state.blocks[id].type, id); break; }
    case "blk-add": addBlockSheet(); break;
    case "blk-new": blockForm(d.type, null); break;
    case "dev-css": form({ title: t("Custom style (CSS)"), fields: [{ id: "css", label: "CSS", type: "code", value: state.settings.css || "", placeholder: ".hero{background:#1b2a4a}\n.kpi b{font-size:22px}", hint: t("Applied on top of the app's own style. Clear the box to undo.") }],
        onSave: v => commit(s => { s.settings.css = v.css; }, t("Style applied")) }); break;
    case "dev-json": form({ title: t("Data editor (JSON)"), fields: [{ id: "json", label: "JSON", type: "code", value: JSON.stringify(state, null, 2), hint: t("Export a backup before big changes. Invalid JSON is not saved.") }],
        onSave: v => { let parsed; try { parsed = JSON.parse(v.json); } catch (err) { return t("That isn't valid JSON: {0}", err.message); } state = normalize(parsed); commit(() => {}, t("Data saved")); } }); break;
    case "dev-reset-layout": commit(s => { s.layout = {}; Object.assign(s, normalize(s)); }, t("Layout reset")); break;
    case "pick-color": { const box = b.parentElement; box.dataset.value = d.v; box.querySelectorAll(".sw").forEach(x => x.classList.toggle("on", x === b)); break; }
    /* sheets */
    case "sheet-close": closeSheet(); break;
    case "form-save": { if (!top || top.kind !== "form") break; const err = top.onSave(readForm(top)); if (typeof err === "string") { toast(err); break; } if (sheets.length && sheets[sheets.length - 1] === top) { sheets.pop(); if (sheets.length) renderSheet(true); else closeSheetsAll(); } break; }
    case "form-extra": if (top && top.extra) { top.extra.run(); sheets.pop(); if (sheets.length) renderSheet(true); else closeSheetsAll(); } break;
    case "form-delete":
      if (!top.armed) { top.armed = true; b.classList.add("armed"); b.textContent = t("Tap again to confirm"); break; }
      top.onDelete(); if (sheets[sheets.length - 1] === top) { sheets.pop(); if (sheets.length) renderSheet(true); else closeSheetsAll(); } break;
  }
});
/* Settings toggles */
document.addEventListener("change", e => {
  const k = e.target.dataset && e.target.dataset.set; if (!k) return;
  if (!state) state = normalize(blank());
  commit(s => { s.settings[k] = e.target.checked; });
});
$("#scrim").addEventListener("click", () => { if (sheets.length) closeSheet(); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && sheets.length) closeSheet();
  if (e.key === "Enter" && sheets.length && sheets[sheets.length - 1].kind === "form" && e.target.tagName === "INPUT") { e.preventDefault(); document.querySelector('.sheet-b [data-act="form-save"]')?.click(); }
});
document.addEventListener("input", e => {
  if (!e.target.classList.contains("money")) return;
  const raw = e.target.value.replace(/[٠-٩]/g, ch => "٠١٢٣٤٥٦٧٨٩".indexOf(ch)).replace(/[^0-9]/g, "");
  e.target.value = raw ? Number(raw).toLocaleString("en-US") : "";
});
$("#restore-file").addEventListener("change", e => {
  const f = e.target.files && e.target.files[0]; e.target.value = ""; if (!f) return;
  const r = new FileReader();
  r.onload = () => { let d = null; try { d = fromBackup(JSON.parse(r.result)); } catch (_) {}
    if (!d) { toast(t("That file isn't a Memo Finance backup.")); return; }
    const keep = state ? state.settings : null; state = d; if (keep && !JSON.parse(r.result).settings) state.settings = keep;
    closeSheetsAll(); commit(() => {}, t("Backup restored")); };
  r.onerror = () => toast(t("Couldn't read that file. Try again."));
  r.readAsText(f);
});

/* ---------- tab bar motion ---------- */
const nav = $("#tabs"), tabbar = $("#tabbar");
function goTab(tb) {
  if (!TABS.includes(tb)) return;
  if (tb !== tab) { nav.classList.add("moving"); setTimeout(() => nav.classList.remove("moving"), 260); }
  tab = tb; try { history.replaceState(null, "", "#" + tab); } catch (_) {}
  render(); window.scrollTo(0, 0); tabbar.classList.remove("mini");
}
/* Slide a finger along the bar to move between tabs, like iOS. */
let drag = null;
const idxAt = x => { const r = nav.getBoundingClientRect(); let i = Math.floor((x - r.left - 6) / ((r.width - 12) / 5)); if (document.documentElement.dir === "rtl") i = 4 - i; return clamp(i, 0, 4); };
nav.addEventListener("pointerdown", e => { drag = { x: e.clientX, i: idxAt(e.clientX), moved: false }; });
nav.addEventListener("pointermove", e => {
  if (!drag) return;
  if (!drag.moved && Math.abs(e.clientX - drag.x) > 8) { drag.moved = true; nav.classList.add("dragging"); try { nav.setPointerCapture(e.pointerId); } catch (_) {} }
  if (drag.moved) { drag.i = idxAt(e.clientX); nav.style.setProperty("--i", drag.i); }
});
const endDrag = () => { if (!drag) return; const dd = drag; drag = null; nav.classList.remove("dragging"); if (dd.moved) goTab(TABS[dd.i]); };
nav.addEventListener("pointerup", endDrag); nav.addEventListener("pointercancel", endDrag);
/* Shrink the bar while scrolling down, bring it back when scrolling up; show a compact title once the big one has scrolled away. */
let lastY = 0, ticking = false;
window.addEventListener("scroll", () => {
  if (ticking) return; ticking = true;
  requestAnimationFrame(() => { const y = window.scrollY;
    if (y > lastY + 6 && y > 80) tabbar.classList.add("mini"); else if (y < lastY - 6 || y < 40) tabbar.classList.remove("mini");
    $("#topbar").classList.toggle("on", y > 64); lastY = y; ticking = false; });
}, { passive: true });
tabbar.addEventListener("click", () => tabbar.classList.remove("mini"));

/* ---------- boot ---------- */
const h0 = (location.hash || "").slice(1); if (TABS.includes(h0)) tab = h0;
const cached = readCache();
if (cached) state = normalize(cached); else if (PREVIEW) state = normalize(sampleData());
if (state) { syncState(state); cacheLocal(); }
applySettings(); render();
if (state && state.settings.pinHash) lockNow();
if (!PREVIEW) {
  try { navigator.storage?.persist?.(); } catch (_) {}
  if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
/* Sample numbers for the preview page only: three months of history, a closed debt, an ended expense, goals, accounts and a custom section. */
function sampleData() {
  const cur = monthKey(), prev = addMonths(cur, -1), prev2 = addMonths(cur, -2), prev3 = addMonths(cur, -3);
  const sched = (n, amt, paidOns) => Array.from({ length: n }, (_, i) => ({ amount: amt, done: i < paidOns.length, ...(paidOns[i] ? { paidOn: paidOns[i] } : {}) }));
  const snap = (rem, act, nw, dl) => ({ salary: 3000000, rate: 150000, obligations: 3000000 - rem, remaining: rem, actual: act, netWorth: nw, debtLeft: dl, cats: { debt: 600000, family: 450000, living: 355000, car: 350000, ef: 100000, goals: 150000 } });
  return {
    income: { salaryUSD: 2000, ratePer100: 150000, payday: 1 },
    family: [{ id: "f1", name: "Parents", amount: 300000 }, { id: "f2", name: "Brother's tuition", amount: 150000, closedOn: prev }],
    living: [{ id: "l1", name: "Home internet", amount: 40000 }, { id: "l2", name: "Electricity", amount: 30000 }, { id: "l3", name: "Groceries", amount: 250000 }, { id: "l4", name: "Gym", amount: 35000, closedOn: cur }],
    custom: [{ id: "s1", name: "Subscriptions", color: "#B565D9", inBudget: true, items: [{ id: "i1", name: "Phone plan", amount: 25000 }, { id: "i2", name: "Streaming", amount: 15000 }] }],
    car: { fuel: 300000, maintenance: 50000, log: [{ id: "c1", date: cur + "-04", type: "Fuel", amount: 60000 }, { id: "c2", date: prev + "-18", type: "Repair", amount: 120000 }] },
    emergency: { monthly: 100000, log: [{ label: monthLabel(prev3), amount: 100000, month: prev3 }, { label: monthLabel(prev2), amount: 100000, month: prev2 }, { label: monthLabel(prev), amount: 150000, month: prev }] },
    goals: [{ id: "g1", name: "NEBOSH Diploma", target: 3000000, monthly: 150000, deadline: addMonths(cur, 10), contributions: [{ month: prev2, amount: 150000 }, { month: prev, amount: 150000 }] },
            { id: "g2", name: "Summer travel", target: 2500000, monthly: 0, deadline: addMonths(cur, 7), contributions: [{ month: prev, amount: 300000 }] }],
    accounts: [{ id: "a1", name: "Bank account", type: "bank", balance: 1200000 }, { id: "a2", name: "Cash at home", type: "cash", balance: 350000 }, { id: "a3", name: "Gold", type: "gold", balance: 2000000 }],
    spending: [{ id: "x1", date: cur + "-02", month: cur, cat: "family", amount: 300000, note: "Parents", src: "family:f1" }, { id: "x2", date: cur + "-06", month: cur, cat: "living", amount: 280000, note: "Groceries" }, { id: "x3", date: cur + "-09", month: cur, cat: "other", amount: 90000, note: "Gift" }],
    checklist: { [cur]: { "family:f1": true } },
    plan: { extra: 150000, strategy: "snowball" },
    debts: [
      { id: "d1", name: "Phone", total: 900000, installment: 150000, payments: sched(6, 150000, [null, null, null, prev3, prev2, prev]), closedOn: prev },
      { id: "d2", name: "Laptop", total: 1800000, installment: 200000, payments: sched(9, 200000, [null, prev2, prev, cur]) },
      { id: "d3", name: "Furniture", total: 3000000, installment: 250000, rate: 12, payments: sched(12, 250000, [null, null, prev2, prev]) }],
    months: { [prev3]: snap(845000, 2100000, 2650000, 3950000), [prev2]: snap(995000, 2010000, 3100000, 3500000), [prev]: snap(995000, 2240000, 3600000, 3050000) }
  };
}
}
